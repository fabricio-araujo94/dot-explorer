name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev build-essential cmake

      - name: Configure and Build
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -B build -S . \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Build and Run Tests with Sanitizers (ASan & UBSan)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -B build-sanitizers -S . \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitizers
          ctest --test-dir build-sanitizers --output-on-failure
